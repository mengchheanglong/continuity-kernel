services:
  postgres:
    image: docker.io/library/postgres@sha256:0c49c0c906cb405ea65e70c284570fee91c7750ca9336369afc0edf4fce211db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - continuity_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

  restate:
    platform: linux/amd64
    image: docker.restate.dev/restatedev/restate@sha256:9c9b8dc71581c02ce1d85dd9928ed2728b92a5a43499880c86a1fa8b01fab86a
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9070:9070"
    volumes:
      - continuity_restate_data:/restate-data

volumes:
  continuity_postgres_data:
  continuity_restate_data:
